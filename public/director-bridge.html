<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-src 'self';" />
        <title>Director Bridge</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                background: #171715;
            }
            html {
                overflow: hidden;
            }
            body {
                overflow: auto;
            }
            iframe {
                display: block;
                width: max(100%, 980px);
                height: 100%;
                margin: 0;
                border: 0;
                background: #171715;
            }
            .director-view-lock {
                color: #3b82f6 !important;
                width: 30px !important;
                height: 30px !important;
                min-width: 30px !important;
                min-height: 30px !important;
                padding: 5px !important;
                border: 1px solid #3b82f6 !important;
                background: #17243b !important;
                display: inline-grid !important;
                place-items: center !important;
            }
            .director-view-lock[aria-pressed="true"] {
                color: #ef4444 !important;
                border-color: #ef4444 !important;
                background: #3b191c !important;
            }
            .director-view-lock svg {
                width: 18px;
                height: 18px;
                display: block;
            }
        </style>
    </head>
    <body>
        <iframe id="monoform" title="Santu Director 预演" allow="fullscreen" referrerpolicy="same-origin"></iframe>
        <script>
            (() => {
                "use strict";
                const VERSION = 1;
                const SOURCE = "infinite-canvas-director-bridge";
                const MAX_PROJECT_CHARS = 2 * 1024 * 1024;
                const MAX_EXPORT_BYTES = 80 * 1024 * 1024;
                const VISUALLY_OPEN_LOCK_PATH = "M757.810429 373.751333 325.645708 373.751333l0-83.895759c0-103.694687 81.507362-184.922686 185.559183-184.922686 78.121242 0 146.053424 46.74565 173.062568 119.090329 3.865028 10.352789 15.384385 15.609513 25.742291 11.746532 10.351766-3.866051 15.609513-15.390525 11.744485-25.742291C688.844707 121.877815 606.198405 64.918545 511.204891 64.918545c-61.918211 0-119.246895 23.662933-161.423483 66.63156-41.3692 42.142819-64.151066 98.363262-64.151066 158.305469l0 83.895759-20.007683 0c-60.774155 0-110.042255 49.267077-110.042255 110.042255l0 366.139981c0 60.774155 49.267077 110.042255 110.042255 110.042255l492.187769 0c60.775178 0 110.042255-49.267077 110.042255-110.042255L867.852684 483.793588C867.852684 423.01841 818.585607 373.751333 757.810429 373.751333zM827.837318 849.933569c0 38.674834-31.352055 70.02689-70.02689 70.02689L265.62266 919.960459c-38.674834 0-70.02689-31.352055-70.02689-70.02689L195.59577 483.793588c0-38.674834 31.352055-70.02689 70.02689-70.02689l492.187769 0c38.674834 0 70.02689 31.352055 70.02689 70.02689L827.837318 849.933569zM509.715981 583.832002c-11.048637 0-20.007683 8.959046-20.007683 20.007683l0 110.042255c0 11.048637 8.958022 20.007683 20.007683 20.007683s20.007683-8.958022 20.007683-20.007683L529.723663 603.839685C529.723663 592.790024 520.765641 583.832002 509.715981 583.832002z";
                const VISUALLY_CLOSED_LOCK_PATH = "M753.845117 371.674021l-17.46272 0 0-83.669608c0-59.275012-22.62837-115.203812-63.715137-157.482731-42.170448-43.394323-99.369172-67.291592-161.058163-67.291592-126.040624 0-224.772276 98.731652-224.772276 224.7733l0 83.669608-16.680914 0c-62.788022 0-113.688295 50.900274-113.688295 113.688295L156.467611 842.961784c0 62.788022 50.900274 113.688295 113.688295 113.688295l483.690234 0c62.788022 0 113.688295-50.900274 113.688295-113.688295L867.534436 485.362316C867.532389 422.574295 816.633139 371.674021 753.845117 371.674021zM328.176344 288.005436c0-102.858646 80.573083-183.432753 183.431729-183.432753 50.423413 0 97.093339 19.447934 131.410935 54.762231 33.547047 34.519188 52.021817 80.214926 52.021817 128.670521l0 83.669608L328.176344 371.675044 328.176344 288.005436zM826.191842 842.961784c0 39.956014-32.390711 72.346725-72.346725 72.346725L270.154883 915.308509c-39.956014 0-72.346725-32.390711-72.346725-72.346725L197.808158 485.362316c0-39.956014 32.390711-72.346725 72.346725-72.346725l483.690234 0c39.956014 0 72.346725 32.390711 72.346725 72.346725L826.191842 842.961784zM509.932921 580.446905c-11.416004 0-20.670785 9.254781-20.670785 20.670785l0 109.554138c0 11.414981 9.254781 20.670785 20.670785 20.670785 11.416004 0 20.670785-9.254781 20.670785-20.670785L530.603707 601.116667C530.602683 589.701686 521.348925 580.446905 509.932921 580.446905z";
                const query = new URLSearchParams(location.search);
                const nodeId = query.get("nodeId") || "";
                if (!/^[A-Za-z0-9_-]{1,128}$/.test(nodeId)) throw new Error("Invalid director node id");
                const storageKey = `monoform-project-${nodeId}`;
                // Older Santu-branded bundles use this key; keep it in sync while the
                // bridge continues to expose the reference Monoform key.
                const legacyStorageKey = `santu-director-project-${nodeId}`;
                const frame = document.getElementById("monoform");
                let lastSnapshot = "";
                let loadedProjectFingerprint = "";
                const exportIds = new WeakMap();
                const viewLockKey = `monoform-view-lock-${nodeId}`;

                function post(type, payload = {}) {
                    if (window.parent === window) return;
                    window.parent.postMessage({ source: SOURCE, schemaVersion: VERSION, type, nodeId, ...payload }, location.origin);
                }

                function readSnapshot() {
                    const projectJson = localStorage.getItem(legacyStorageKey) || localStorage.getItem(storageKey) || "";
                    return projectJson.length <= MAX_PROJECT_CHARS ? projectJson : "";
                }

                function saveCurrentProject() {
                    const documentRef = frame.contentDocument;
                    const saveButton = Array.from(documentRef?.querySelectorAll(".top-actions button") || []).find((button) => button.textContent?.trim() === "保存");
                    saveButton?.click();
                    const projectJson = readSnapshot();
                    if (projectJson) localStorage.setItem(storageKey, projectJson);
                    return projectJson;
                }

                function exportIdFor(blob) {
                    const existing = exportIds.get(blob);
                    if (existing) return existing;
                    const exportId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}`;
                    exportIds.set(blob, exportId);
                    return exportId;
                }

                function readDurationMs() {
                    try {
                        const project = JSON.parse(readSnapshot() || "null");
                        const activeShot = Array.isArray(project?.shots) ? project.shots.find((shot) => shot?.id === project.activeShotId) || project.shots[0] : null;
                        const seconds = Number(activeShot?.durationSeconds ?? project?.settings?.durationSeconds);
                        return Number.isFinite(seconds) && seconds > 0 ? Math.round(seconds * 1000) : 0;
                    } catch {
                        return 0;
                    }
                }

                frame.addEventListener("load", () => {
                    post("director:ready");
                    const projectJson = readSnapshot();
                    if (projectJson) post("director:project-snapshot", { projectJson });
                    installViewLock();
                });

                function installViewLock() {
                    const documentRef = frame.contentDocument;
                    if (!documentRef || documentRef.documentElement.dataset.viewLockInstalled === "1") return;
                    const actions = documentRef.querySelector(".monitor-head-actions");
                    if (!actions) {
                        window.setTimeout(installViewLock, 120);
                        return;
                    }
                    documentRef.documentElement.dataset.viewLockInstalled = "1";
                    if (!documentRef.getElementById("director-view-lock-style")) {
                        const style = documentRef.createElement("style");
                        style.id = "director-view-lock-style";
                        style.textContent = `.director-view-lock{color:#3b82f6!important;width:30px!important;height:30px!important;min-width:30px!important;min-height:30px!important;padding:5px!important;border:1px solid #3b82f6!important;background:#17243b!important;display:inline-grid!important;place-items:center!important}.director-view-lock[aria-pressed="true"]{color:#ef4444!important;border-color:#ef4444!important;background:#3b191c!important}.director-view-lock svg{width:18px;height:18px;display:block}`;
                        documentRef.head.appendChild(style);
                    }
                    const button = documentRef.createElement("button");
                    const storedLock = window.localStorage.getItem(viewLockKey);
                    const locked = storedLock === null ? true : storedLock === "1";
                    button.type = "button";
                    button.className = "director-view-lock";
                    button.setAttribute("aria-label", locked ? "解除视角锁定" : "锁定视角");
                    button.setAttribute("title", locked ? "解除视角锁定" : "锁定视角");
                    button.setAttribute("aria-pressed", String(locked));
                    setLockIcon(button, locked);
                    actions.prepend(button);
                    function setLockIcon(target, nextLocked) {
                        target.replaceChildren();
                        const svg = documentRef.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("viewBox", "0 0 1024 1024");
                        svg.setAttribute("aria-hidden", "true");
                        const path = documentRef.createElementNS("http://www.w3.org/2000/svg", "path");
                        path.setAttribute("d", nextLocked ? VISUALLY_CLOSED_LOCK_PATH : VISUALLY_OPEN_LOCK_PATH);
                        path.setAttribute("fill", "currentColor");
                        svg.appendChild(path);
                        target.appendChild(svg);
                    }
                    const setLocked = (next) => {
                        documentRef.documentElement.dataset.viewLocked = next ? "1" : "0";
                        window.localStorage.setItem(viewLockKey, next ? "1" : "0");
                        button.setAttribute("aria-label", next ? "解除视角锁定" : "锁定视角");
                        button.setAttribute("title", next ? "解除视角锁定" : "锁定视角");
                        button.setAttribute("aria-pressed", String(next));
                        setLockIcon(button, next);
                    };
                    setLocked(locked);
                    button.addEventListener("click", () => setLocked(documentRef.documentElement.dataset.viewLocked !== "1"));
                    const isCanvasInput = (event) => event.target instanceof documentRef.defaultView.HTMLCanvasElement;
                    const blockWhenLocked = (event) => {
                        if (documentRef.documentElement.dataset.viewLocked !== "1" || !isCanvasInput(event)) return;
                        event.preventDefault();
                        event.stopImmediatePropagation();
                    };
                    ["pointerdown", "pointermove", "pointerup", "wheel", "touchstart", "touchmove", "touchend"].forEach((type) => documentRef.addEventListener(type, blockWhenLocked, { capture: true, passive: false }));
                    documentRef.addEventListener("wheel", (event) => {
                        if (documentRef.documentElement.dataset.viewLocked === "1" || Math.abs(event.deltaX) <= Math.abs(event.deltaY) || event.ctrlKey) return;
                        const mode = documentRef.querySelector(".viewport-label strong")?.textContent?.trim();
                        if (mode !== "摄像机视角") return;
                        const canvas = event.target;
                        const controls = canvas?.__r3f?.root?.getState?.().controls;
                        if (!controls || typeof controls.getAzimuthalAngle !== "function" || typeof controls.setAzimuthalAngle !== "function") return;
                        event.preventDefault();
                        controls.setAzimuthalAngle(controls.getAzimuthalAngle() - event.deltaX * 0.004);
                    }, { passive: false });
                }

                window.addEventListener("message", (event) => {
                    if (event.origin !== location.origin) return;
                    if (event.source === frame.contentWindow) {
                        const data = event.data;
                        if (!data || data.source !== "monoform" || data.type !== "export") return;
                        const kind = data.kind === "image" ? "image" : data.kind === "video" ? "video" : "";
                        const blob = data.blob;
                        const validMime = kind === "image" ? ["image/png", "image/jpeg", "image/webp"].includes(blob?.type) : blob?.type === "video/mp4";
                        if (!kind || !(blob instanceof Blob) || !blob.size || blob.size > MAX_EXPORT_BYTES || !validMime) {
                            post("director:error", { code: "invalid_export", message: "导出文件不符合安全限制" });
                            return;
                        }
                        const projectJson = saveCurrentProject();
                        if (!projectJson) {
                            post("director:error", { code: "missing_project", message: "导演工程保存失败，请重试" });
                            return;
                        }
                        lastSnapshot = projectJson;
                        post("director:export", { kind, blob, projectJson, exportId: exportIdFor(blob), width: Number(data.width) || 0, height: Number(data.height) || 0, durationMs: kind === "video" ? readDurationMs() : 0 });
                        return;
                    }
                    if (event.source !== window.parent) return;
                    const data = event.data;
                    if (!data || data.source !== "infinite-canvas-host" || data.schemaVersion !== VERSION || data.nodeId !== nodeId) return;
                    if (data.type === "host:load-project") {
                        const projectJson = typeof data.projectJson === "string" ? data.projectJson : "";
                        if (!projectJson || projectJson.length > MAX_PROJECT_CHARS || projectJson === loadedProjectFingerprint) return;
                        try {
                            JSON.parse(projectJson);
                            loadedProjectFingerprint = projectJson;
                            lastSnapshot = projectJson;
                            localStorage.setItem(storageKey, projectJson);
                            localStorage.setItem(legacyStorageKey, projectJson);
                            frame.contentWindow.location.reload();
                        } catch {
                            post("director:error", { code: "invalid_project", message: "工程数据无法恢复" });
                        }
                    }
                    if (data.type === "host:request-project") {
                        const projectJson = readSnapshot();
                        if (projectJson) post("director:project-snapshot", { projectJson });
                    }
                    if (data.type === "host:shortcut") {
                        const code = ["KeyQ", "KeyW", "KeyE", "KeyR"].includes(data.code) ? data.code : "";
                        if (code) frame.contentWindow?.postMessage({ source: "santu-director-bridge", type: "shortcut", code }, location.origin);
                    }
                });

                window.setInterval(() => {
                    const projectJson = readSnapshot();
                    if (!projectJson || projectJson === lastSnapshot) return;
                    lastSnapshot = projectJson;
                    post("director:project-snapshot", { projectJson });
                }, 1000);

                frame.src = `/monoform/index.html?key=${encodeURIComponent(nodeId)}`;
            })();
        </script>
    </body>
</html>
