<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Santu Infinite Canvas workflow</title>
  <desc id="desc">Five calm editorial steps from input to reusable, traceable delivery.</desc>
  <rect width="1200" height="360" fill="#202a27"/>
  <path d="M92 180H1108" stroke="#7c9a87" stroke-width="2" stroke-dasharray="5 9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(48 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">01</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">Collect</text><text x="24" y="132" fill="#58625e" font-size="18">Images, prompts,</text><text x="24" y="160" fill="#58625e" font-size="18">and references</text></g>
    <g transform="translate(268 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#7c9a87"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">02</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">Connect</text><text x="24" y="132" fill="#58625e" font-size="18">Build a reusable</text><text x="24" y="160" fill="#58625e" font-size="18">node context</text></g>
    <g transform="translate(488 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">03</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">Generate</text><text x="24" y="132" fill="#58625e" font-size="18">Route media tasks</text><text x="24" y="160" fill="#58625e" font-size="18">through one API</text></g>
    <g transform="translate(708 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#7c9a87"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">04</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">Preview</text><text x="24" y="132" fill="#58625e" font-size="18">Direct scenes,</text><text x="24" y="160" fill="#58625e" font-size="18">cameras, and frames</text></g>
    <g transform="translate(928 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">05</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">Deliver</text><text x="24" y="132" fill="#58625e" font-size="18">Archive outputs,</text><text x="24" y="160" fill="#58625e" font-size="18">usage, and runs</text></g>
    <g fill="#7c9a87"><path d="M250 174l12 6-12 6z"/><path d="M470 174l12 6-12 6z"/><path d="M690 174l12 6-12 6z"/><path d="M910 174l12 6-12 6z"/></g>
