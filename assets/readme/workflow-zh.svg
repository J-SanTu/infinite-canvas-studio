<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Santu 无限画布工作流</title>
  <desc id="desc">从输入素材到可复用、可追踪交付的五个简洁步骤。</desc>
  <rect width="1200" height="360" fill="#202a27"/>
  <path d="M92 180H1108" stroke="#7c9a87" stroke-width="2" stroke-dasharray="5 9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(48 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">01</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">收集</text><text x="24" y="132" fill="#58625e" font-size="18">图片、提示词</text><text x="24" y="160" fill="#58625e" font-size="18">和参考素材</text></g>
    <g transform="translate(268 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#7c9a87"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">02</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">连接</text><text x="24" y="132" fill="#58625e" font-size="18">建立可复用的</text><text x="24" y="160" fill="#58625e" font-size="18">节点上下文</text></g>
    <g transform="translate(488 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">03</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">生成</text><text x="24" y="132" fill="#58625e" font-size="18">通过统一 API</text><text x="24" y="160" fill="#58625e" font-size="18">调度媒体任务</text></g>
    <g transform="translate(708 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#7c9a87"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">04</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">预演</text><text x="24" y="132" fill="#58625e" font-size="18">导演场景、镜头</text><text x="24" y="160" fill="#58625e" font-size="18">和关键帧</text></g>
    <g transform="translate(928 76)"><rect width="200" height="208" fill="#f6f3ed"/><circle cx="34" cy="38" r="19" fill="#c65a43"/><text x="34" y="45" text-anchor="middle" fill="#fffdfa" font-size="16" font-weight="700">05</text><text x="24" y="94" fill="#202a27" font-size="25" font-weight="700">交付</text><text x="24" y="132" fill="#58625e" font-size="18">归档结果、用量</text><text x="24" y="160" fill="#58625e" font-size="18">和任务记录</text></g>
    <g fill="#7c9a87"><path d="M250 174l12 6-12 6z"/><path d="M470 174l12 6-12 6z"/><path d="M690 174l12 6-12 6z"/><path d="M910 174l12 6-12 6z"/></g>
  </g>
</svg>
