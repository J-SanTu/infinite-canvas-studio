name: macOS desktop build

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.19.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm build
            - run: pnpm test:local
            - run: pnpm test:top-nav-static-ui
            - run: pnpm test:director-static-ui
            - run: pnpm pack:mac
            - uses: actions/upload-artifact@v4
              with:
                  name: santu-infinite-canvas-macos-arm64
                  path: |
                      macOS/*.dmg
                      macOS/*.zip
                  if-no-files-found: error
            - name: Upload macOS release assets
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.ref_name }}" macOS/*.dmg macOS/*.zip --clobber
